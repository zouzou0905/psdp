interface:
  display_name: "亚马逊热点母体衍生配件选品"
  short_description: "验证热点母体、开放式品牌兼容配件、供需缺口和剩余需求窗口"
  default_prompt: "使用 $select-sorftime-amazon-trending-accessories 从热门品类、产品线、型号或ASIN下钻，寻找通用或开放式第三方兼容配件，并验证母体动量、配件需求、供需缺口、兼容/IP和剩余窗口。"

dependencies:
  tools:
    - type: "mcp"
      value: "sorftime"
      description: "Sorftime Amazon market data and procurement-space validation"
      transport: "streamable_http"
      url: "https://mcp.sorftime.com"
